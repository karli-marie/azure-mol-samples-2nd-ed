name: Deploy pizza website to Azure - KSWebApp

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8DBBF56FBD1B48A396A60DA22E546A75 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DAECF65BCFA14FEDBFD9366CC1F7E36D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D335898285004E80A94BDA2CCF147FDE }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: KSWebApp
          slot-name: Production
          package: .
          
